<template x-if="user && user.role === 'student' && currentView === 'dashboard'">
      <div class="dashboard-layout dashboard-layout--student" :class="{ 'dashboard-layout--collapsed': sidebarCollapsed, 'dashboard-layout--mobile-open': sidebarOpen }" x-data="{ dashboardSection: currentView === 'student_exams' ? 'exams' : 'overview' }">
        <aside class="dashboard-sidebar">
          <div class="dashboard-sidebar-header">
            <div>
              <p class="dashboard-sidebar-label">STUDENT</p>
              <h2 class="dashboard-sidebar-title">My workspace</h2>
            </div>
            <button type="button" class="dashboard-sidebar-toggle" @click="toggleSidebar()" :aria-expanded="!sidebarCollapsed" :aria-label="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'" :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
              <svg class="icon" :class="{ 'is-collapsed': sidebarCollapsed }"><use href="#icon-arrow-left" /></svg>
            </button>
          </div>
          <nav class="dashboard-nav" aria-label="Student dashboard">
            <button type="button" class="dashboard-nav-link" :class="dashboardSection === 'overview' ? 'is-current' : ''" title="Overview" @click="navigateToDashboard()">
              <svg class="icon"><use href="#icon-activity" /></svg>
              <span>Overview</span>
            </button>
            <button type="button" class="dashboard-nav-link" :class="dashboardSection === 'exams' ? 'is-current' : ''" title="Examinations" @click="navigateToExaminations()">
              <svg class="icon"><use href="#icon-file-text" /></svg>
              <span>Examinations</span>
            </button>
          </nav>
          <p class="dashboard-sidebar-note">Access examinations with a key provided by your teacher.</p>
        </aside>
        <button type="button" class="dashboard-sidebar-backdrop" x-show="sidebarOpen" @click="sidebarOpen = false" aria-label="Close navigation"></button>

        <div class="dashboard-main">
          <section id="student-overview" x-show="dashboardSection === 'overview'">
            <div style="margin-bottom: 2rem;">
              <div class="badge badge-neutral" style="margin-bottom: 0.5rem;">
                <svg class="icon" style="width: 14px; height: 14px;"><use href="#icon-user" /></svg>
                <span>Student Portal</span>
              </div>
              <h1 class="section-title">Overview</h1>
              <p class="text-muted">View your unlocked examinations and use a teacher-provided key to access a new exam.</p>
            </div>
            <button type="button" @click="navigateToExaminations()" class="btn btn-primary">
              <svg class="icon" style="stroke: #fff;"><use href="#icon-file-text" /></svg>
              <span>View Examinations</span>
            </button>
          </section>
</template>
