    <!-- 2. TEACHER DASHBOARD VIEW -->
    <template x-if="user && user.role === 'teacher' && currentView === 'dashboard'">
      <div class="dashboard-layout dashboard-layout--teacher" :class="{ 'dashboard-layout--collapsed': sidebarCollapsed, 'dashboard-layout--mobile-open': sidebarOpen }">
        <aside class="dashboard-sidebar">
          <div class="dashboard-sidebar-header">
            <div>
              <p class="dashboard-sidebar-label">TEACHER</p>
              <h2 class="dashboard-sidebar-title">Workspace</h2>
            </div>
            <button type="button" class="dashboard-sidebar-toggle" @click="toggleSidebar()" :aria-expanded="!sidebarCollapsed" :aria-label="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'" :title="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'">
              <svg class="icon" :class="{ 'is-collapsed': sidebarCollapsed }"><use href="#icon-arrow-left" /></svg>
            </button>
          </div>
          <nav class="dashboard-nav" aria-label="Teacher dashboard">
            <button type="button" class="dashboard-nav-link is-current" title="Overview" @click="navigateToDashboard()">
              <svg class="icon"><use href="#icon-activity" /></svg>
              <span>Overview</span>
            </button>
            <button type="button" class="dashboard-nav-link" title="Examinations" @click="navigateToExaminations()">
              <svg class="icon"><use href="#icon-file-text" /></svg>
              <span>Examinations</span>
            </button>
          </nav>
          <p class="dashboard-sidebar-note">Create assessments and review student submissions.</p>
        </aside>
        <button type="button" class="dashboard-sidebar-backdrop" x-show="sidebarOpen" @click="sidebarOpen = false" aria-label="Close navigation"></button>

        <div class="dashboard-main">
          <section id="teacher-overview">
            <div style="margin-bottom: 2rem;">
              <div class="badge badge-primary" style="margin-bottom: 0.5rem;">
                <svg class="icon" style="width: 14px; height: 14px;"><use href="#icon-user" /></svg>
                <span>Teacher Workspace</span>
              </div>
              <h1 class="section-title">Overview</h1>
              <p class="text-muted">Manage your examinations and review student typing forensics from your workspace.</p>
            </div>
            <button type="button" @click="navigateToExaminations()" class="btn btn-primary">
              <svg class="icon" style="stroke: #fff;"><use href="#icon-file-text" /></svg>
              <span>View Examinations</span>
            </button>
          </section>
        </div>
      </div>
    </template>
