  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="navbar-inner">
      <template x-if="user && ['dashboard', 'teacher_exams', 'student_exams'].includes(currentView)">
        <button type="button" class="navbar-sidebar-toggle" @click="toggleSidebar()" :aria-expanded="sidebarOpen" :aria-label="sidebarOpen ? 'Close navigation' : 'Open navigation'" :title="sidebarOpen ? 'Close navigation' : 'Open navigation'">
          <svg class="icon" :class="{ 'is-collapsed': !sidebarOpen }"><use href="#icon-arrow-left" /></svg>
        </button>
      </template>
      <a class="brand" :href="user ? (user.role === 'teacher' ? '/teacher/dashboard' : '/student/dashboard') : '/'">
        <div class="brand-badge-ai">
          <svg class="icon" style="stroke: #fff;"><use href="#icon-shield" /></svg>
        </div>
        <div>
          <div class="brand-name">AntiPaste<span style="color: var(--color-primary);">Exam</span></div>
          <span class="brand-tagline">Write, Don't Paste</span>
        </div>
      </a>

      <div class="navbar-actions">
        <template x-if="user">
          <div class="navbar-user">
            <div class="navbar-user-desktop">
              <span class="badge" :class="user.role === 'teacher' ? 'badge-primary' : 'badge-neutral'">
                <span class="pulse-indicator"></span>
                <span x-text="user.role"></span>
              </span>
              <span class="navbar-user-name" x-text="user.name"></span>
              <button @click="logout()" class="btn btn-secondary btn-sm">Sign Out</button>
            </div>
            <div class="profile-menu" @click.outside="profileMenuOpen = false">
              <button type="button" class="profile-menu-toggle" @click="profileMenuOpen = !profileMenuOpen" :aria-expanded="profileMenuOpen" aria-label="Open profile menu">
                <svg class="icon"><use href="#icon-user" /></svg>
              </button>
              <div class="profile-menu-panel" x-show="profileMenuOpen" x-cloak>
                <span class="profile-menu-name" x-text="user.name"></span>
                <span class="badge" :class="user.role === 'teacher' ? 'badge-primary' : 'badge-neutral'">
                  <span x-text="user.role"></span>
                </span>
                <button type="button" @click="logout()" class="btn btn-secondary btn-sm">Sign Out</button>
              </div>
            </div>
          </div>
        </template>
        <template x-if="!user">
          <div style="display: flex; align-items: center; gap: 0.75rem;">
            <button @click="authMode = 'login'; document.getElementById('auth-card')?.scrollIntoView({ behavior: 'smooth' })" class="btn btn-secondary btn-sm">
              Sign In
            </button>
            <button @click="authMode = 'register'; document.getElementById('auth-card')?.scrollIntoView({ behavior: 'smooth' })" class="btn btn-primary btn-sm">
              Get Started
            </button>
          </div>
        </template>
      </div>
    </div>
  </header>
